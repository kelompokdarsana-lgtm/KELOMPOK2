<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="description" content="Belajar Sad Darsana, enam sistem filsafat Hindu, lengkap dengan materi ringkas dan kuis interaktif. Tugas Kelompok 2.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#22092b">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sad Darsana – Belajar Filsafat Hindu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito:wght@400;600;700&family=Noto+Sans+Devanagari:wght@600&display=swap" rel="stylesheet">
<script>var t=null;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='dark'&&t!=='light')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.dataset.theme=t</script>
<style>
:root{color-scheme:light;--maroon:#5a0f1e;--deep:#22092b;--saffron:#f28a1b;--gold:#f2c14e;--lotus:#d9457a;--bg:#fff8ec;--ink:#2a1220;--ok:#1f7a3f;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
h1,h2,h3,h4,.brand{font-family:Marcellus,Georgia,serif;font-weight:400;line-height:1.25}
a{color:inherit}
.nav{background:var(--deep);padding:.8rem 1.2rem;position:sticky;top:0;z-index:5;border-bottom:2px solid var(--gold);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.nav .lk{display:flex;gap:.5rem;flex-wrap:wrap}
.nav .lk a{color:#fff3d6;text-decoration:none;font-weight:700;padding:.4rem .9rem;border:1.5px solid rgba(242,193,78,.55);border-radius:999px;white-space:nowrap}
.nav .lk a:hover{background:rgba(242,193,78,.18);color:var(--gold)}
.nav .lk a.on{background:var(--gold);color:var(--deep);border-color:var(--gold)}
.cta{margin-top:2rem;text-align:center;background:#fff;border:2px dashed var(--gold);border-radius:16px;padding:1.2rem}
.cta p{margin:0 0 .8rem}
.brand{color:var(--gold);text-decoration:none;font-size:1.3rem}
.brand span{font-family:'Noto Sans Devanagari',sans-serif;margin-right:.4rem}
.hero{background:radial-gradient(circle at 70% 40%,#7a1730 0,var(--deep) 65%);color:#fff3d6;padding:3rem 1.2rem;overflow:hidden}
.hero-in{max-width:1000px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:2rem;justify-content:center}
.hero-t{flex:1 1 320px}
.hero h1{font-size:clamp(2.2rem,7vw,3.8rem);margin:0 0 .6rem;color:var(--gold)}
.hero p{max-width:34rem;font-size:1.1rem}
.hero-r{display:flex;flex-direction:column;align-items:center;gap:1.4rem;width:min(340px,100%)}
.hero-r .tmr{width:100%;margin-top:0}
.mandala{width:min(320px,80vw);animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.mandala{animation:none}}
.btn{display:inline-block;background:var(--saffron);color:#2a1220;font-weight:700;padding:.75rem 1.4rem;border-radius:999px;border:0;text-decoration:none;cursor:pointer;font:inherit;font-weight:700}
.btn:hover{background:var(--gold)}
.btn.alt{background:transparent;border:2px solid var(--maroon);color:var(--maroon)}
.wrap{max-width:1000px;margin:auto;padding:2rem 1.2rem}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem}
.gal figure{margin:0;background:linear-gradient(160deg,#3a0f2e,var(--maroon));border-radius:18px;padding:.8rem;text-align:center;color:var(--gold);border:1px solid var(--gold)}
.gal svg{width:100%;height:130px}
.gal figcaption{font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}
.card{display:block;text-decoration:none;background:#fff;border:1px solid #ecd9b0;border-top:5px solid var(--saffron);border-radius:14px;padding:1rem 1.1rem}
.card:hover{border-top-color:var(--lotus);box-shadow:0 6px 18px rgba(90,15,30,.15)}
.card b{color:var(--lotus)}
.card h3{margin:.2rem 0;font-size:1.2rem;color:var(--maroon)}
.card p{margin:0;font-size:.92rem}
.topic h1{color:var(--maroon);font-size:clamp(1.8rem,5vw,2.6rem);border-bottom:3px solid var(--gold);padding-bottom:.4rem}
.topic h3{color:var(--maroon);margin-top:1.6rem}
.topic h4{margin:.2rem 0;color:var(--lotus)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.two>div,.note{background:#fff;border-left:5px solid var(--saffron);padding:.6rem 1rem;border-radius:8px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;background:#fff}
th{background:var(--maroon);color:var(--gold);text-align:left}
th,td{padding:.55rem .7rem;border:1px solid #e3cf9f;vertical-align:top}
.quiz{margin-top:2.5rem;background:#fff;border:2px solid var(--gold);border-radius:16px;padding:1.2rem}
fieldset{border:0;border-bottom:1px dashed #d8c390;margin:0 0 1rem;padding:0 0 1rem}
legend{font-weight:700;padding:0;margin-bottom:.4rem}
label{display:block;padding:.4rem .6rem;border-radius:8px;cursor:pointer}
label:hover{background:#fff1d1}
fieldset.ok label.pick{background:#d9f2e0}
fieldset.bad label.pick{background:#fadbd8}
.fb{margin:.4rem 0 0;font-size:.92rem;color:var(--bad);font-weight:600}
fieldset.ok .fb{color:var(--ok)}
.res{margin-top:1rem;padding:1rem;border-radius:12px;background:var(--deep);color:#fff3d6}
.res strong{color:var(--gold);font-size:1.4rem}
.pn{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;flex-wrap:wrap}
footer{text-align:center;padding:1.5rem;background:var(--deep);color:var(--gold);font-size:.9rem}
.tmr{margin-top:1.8rem;background:linear-gradient(160deg,#3a0f2e,var(--maroon));color:#fff3d6;border:1px solid var(--gold);border-radius:16px;padding:1.2rem;text-align:center}
.tmr h2{margin:0 0 .3rem;color:var(--gold);font-size:1.4rem}
.tmr ol{text-align:left;max-width:30rem;margin:.6rem auto 1rem;padding-left:1.3rem;font-size:.95rem}
.ring{position:relative;width:200px;height:200px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:rgba(242,193,78,.25);stroke-width:8}
.ring .fg{fill:none;stroke:var(--saffron);stroke-width:8;stroke-linecap:round;stroke-dasharray:565.5;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}
.ring .tx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tm{font-family:Marcellus,Georgia,serif;font-size:2.6rem;color:var(--gold);line-height:1}
.ring .cue{font-size:.95rem;margin-top:.3rem;min-height:1.5em}
.tmr .row{display:flex;gap:.6rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.tmr .btn.alt{border-color:var(--gold);color:var(--gold)}
@media(prefers-reduced-motion:reduce){.ring .fg{transition:none}}
.tg-btn{background:transparent;color:var(--gold);border:1.5px solid var(--gold);border-radius:999px;padding:.3rem .8rem;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.tg-btn:hover{background:var(--gold);color:var(--deep)}
.lk{align-items:center}
footer .cp{opacity:.85;border-top:1px solid rgba(242,193,78,.3);padding-top:.8rem}
html[data-theme=dark]{--bg:#150a1c;--ink:#f3e6d3;color-scheme:dark}
html[data-theme=dark] .card,html[data-theme=dark] .cta,html[data-theme=dark] .two>div,html[data-theme=dark] .note,html[data-theme=dark] table,html[data-theme=dark] .quiz{background:#241231}
html[data-theme=dark] .card,html[data-theme=dark] .cta,html[data-theme=dark] .quiz{border-color:#5b3b2e}
html[data-theme=dark] th,html[data-theme=dark] td{border-color:#4a3340}
html[data-theme=dark] th{background:#5a0f1e}
html[data-theme=dark] .card h3,html[data-theme=dark] .topic h1,html[data-theme=dark] .topic h3,html[data-theme=dark] h2{color:var(--gold)}
html[data-theme=dark] .card b,html[data-theme=dark] .topic h4{color:#ff8fb8}
html[data-theme=dark] .btn.alt{border-color:var(--gold);color:var(--gold)}
html[data-theme=dark] label:hover{background:#3a2347}
html[data-theme=dark] fieldset{border-bottom-color:#5b3b2e}
html[data-theme=dark] fieldset.ok label.pick{background:#1d4a2c}
html[data-theme=dark] fieldset.bad label.pick{background:#5a2420}
html[data-theme=dark] fieldset.ok .fb{color:#6fe39a}
html[data-theme=dark] .fb{color:#ff8a80}
html[data-theme=dark] .res{background:#3a0f2e}
html[data-theme=dark] .nav,html[data-theme=dark] footer{background:#0e0614}
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 45%,#7a1730 0,var(--deep) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;color:#fff3d6;text-align:center;cursor:pointer;transition:opacity .8s ease,visibility .8s}
#intro.out{opacity:0;visibility:hidden}
#intro .bl{animation:bloom 1.6s cubic-bezier(.2,.8,.2,1) both}
#intro .mandala{width:min(260px,60vw);animation-duration:14s}
#intro .i1{font-family:Marcellus,Georgia,serif;font-size:clamp(1.6rem,6vw,2.4rem);color:var(--gold);margin-top:.8rem;animation:rise .8s .9s ease both}
#intro .i2{letter-spacing:.3em;text-transform:uppercase;font-size:.85rem;animation:rise .8s 1.2s ease both}
#intro .bar{width:140px;height:3px;border-radius:3px;background:rgba(242,193,78,.25);overflow:hidden;margin-top:1.2rem;animation:rise .6s 1.2s ease both}
#intro .bar i{display:block;height:100%;background:var(--gold);transform-origin:left;animation:fill 1.4s 1.2s ease both}
@keyframes bloom{from{opacity:0;transform:scale(.2) rotate(-90deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
html.go .nav{animation:drop .6s ease both}
/* Animasi masuk: pelan, satu per satu, tanpa membuat seluruh isi #app patah */
html.go #app > .anim-seq{
  opacity:0;
  transform:translateY(18px);
  animation:softRise .85s cubic-bezier(.22,.75,.25,1) forwards;
}
html.go #app > .anim-seq:nth-child(2){animation-delay:.22s}
html.go #app > .anim-seq:nth-child(3){animation-delay:.44s}
html.go #app > .anim-seq:nth-child(4){animation-delay:.66s}
html.go #app > .anim-seq:nth-child(5){animation-delay:.88s}
html.go #app > .anim-seq:nth-child(6){animation-delay:1.10s}
html.go .card,html.go .gal figure{
  animation:softRise .75s cubic-bezier(.22,.75,.25,1) both;
}
html.go .card:nth-child(2),html.go .gal figure:nth-child(2){animation-delay:.16s}
html.go .card:nth-child(3),html.go .gal figure:nth-child(3){animation-delay:.32s}
html.go .card:nth-child(4),html.go .gal figure:nth-child(4){animation-delay:.48s}
html.go .card:nth-child(5){animation-delay:.64s}
html.go .card:nth-child(6){animation-delay:.80s}
@keyframes softRise{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
@media(prefers-reduced-motion:reduce){#intro{display:none}html.go .nav,html.go #app>*>*,html.go #app>.anim-seq,html.go .card,html.go .gal figure{animation:none;opacity:1;transform:none}}
@keyframes inF{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes outF{to{opacity:0;transform:translateX(-50px)}}
@keyframes outB{to{opacity:0;transform:translateX(50px)}}
#app{overflow-x:clip}
html.go #app.in.f{animation:inF .65s cubic-bezier(.22,.75,.25,1) both}
html.go #app.in.b{animation:inB .65s cubic-bezier(.22,.75,.25,1) both}
html.go #app.out.f{animation:outF .22s ease-in both}
html.go #app.out.b{animation:outB .22s ease-in both}
@media(prefers-reduced-motion:reduce){html.go #app.in,html.go #app.out{animation:none}}
.kelp{background:var(--deep);border-bottom:2px solid var(--gold);padding:1rem 1.2rem;color:#fff3d6}
.kelp .in{max-width:1000px;margin:auto}
.kelp h2{margin:0 0 .7rem;font-size:1.25rem;color:var(--gold);text-align:center}
.kelp .kt{text-align:center;margin:-.4rem 0 .8rem;font-size:.92rem;color:#fff3d6;opacity:.85}
.kelp ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:.5rem;text-align:left}
.kelp li{display:flex;align-items:center;gap:.6rem;background:rgba(242,193,78,.1);border:1px solid rgba(242,193,78,.45);border-radius:12px;padding:.4rem .7rem;font-size:.92rem}
.kelp li b{flex:none;min-width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--maroon);font-size:.85rem}
html[data-theme=dark] .kelp{background:#0e0614}
.pic{margin:1rem 0 1.4rem;background:linear-gradient(160deg,#3a0f2e,var(--maroon));border:1px solid var(--gold);border-radius:18px;padding:.8rem;text-align:center;color:var(--gold)}
.pic svg{display:block;width:100%;height:auto;max-height:320px}
.pic figcaption{font-size:.92rem;margin-top:.4rem;color:#fff3d6}
[hidden]{display:none!important}
.qz{margin-top:1rem;background:#fff;border:2px solid var(--gold);border-radius:20px;padding:1.2rem}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-weight:700;margin-bottom:.6rem}
.qsc{background:var(--maroon);color:var(--gold);border-radius:999px;padding:.15rem .85rem}
.qbar{height:10px;border-radius:99px;background:#f1e2bd;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--saffron),var(--lotus));transition:width .45s ease}
.qq{font-size:1.2rem;font-weight:700;margin:1.1rem 0 .8rem}
.qo{display:flex;gap:.75rem;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:#fff8ec;border:2px solid #ecd9b0;border-radius:14px;padding:.7rem .9rem;margin:.5rem 0;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.qo:hover:not(:disabled){border-color:var(--saffron);transform:translateX(4px)}
.qo:disabled{cursor:default}
.qo b{flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--maroon);color:var(--gold);font-size:.9rem}
.qo.ok{background:#d9f2e0;border-color:var(--ok);animation:pop .4s ease}
.qo.bad{background:#fadbd8;border-color:var(--bad);animation:shake .4s ease}
.qo.ok b{background:var(--ok);color:#fff}.qo.bad b{background:var(--bad);color:#fff}
.qfb{margin:.9rem 0 .6rem;font-weight:700;min-height:1.5em}
.qfb.ok{color:var(--ok)}.qfb.bad{color:var(--bad)}
.qres{text-align:center}
.qres h2{margin:.2rem 0;color:var(--maroon)}
.qres .stars{font-size:2.4rem;letter-spacing:.25rem}
.qres .big{font-family:Marcellus,Georgia,serif;font-size:4rem;line-height:1;margin:.2rem 0;color:var(--lotus)}
.qres .row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem}
.rv{text-align:left;margin-top:1rem;background:#fff8ec;border:1px dashed var(--gold);border-radius:12px;padding:.6rem 1rem}
.rv summary{cursor:pointer;font-weight:700}
.rv li{margin:.6rem 0}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
html[data-theme=dark] .qz{background:#241231;border-color:#5b3b2e}
html[data-theme=dark] .qbar{background:#4a2a3a}
html[data-theme=dark] .qo{background:#33193f;border-color:#5b3b2e}
html[data-theme=dark] .qo.ok{background:#1d4a2c;border-color:#6fe39a}
html[data-theme=dark] .qo.bad{background:#5a2420;border-color:#ff8a80}
html[data-theme=dark] .qfb.ok{color:#6fe39a}
html[data-theme=dark] .qfb.bad{color:#ff8a80}
html[data-theme=dark] .qres h2{color:var(--gold)}
html[data-theme=dark] .rv{background:#33193f}
@media(prefers-reduced-motion:reduce){.qo.ok,.qo.bad{animation:none}.qo,.qbar i{transition:none}.champion,.champion-badge,.champion-title,.champion-stamp,.champion-spark{animation:none!important}}
@keyframes champIn{0%{opacity:0;transform:scale(.72) translateY(30px);filter:blur(8px)}60%{opacity:1;transform:scale(1.04) translateY(-4px);filter:blur(0)}100%{transform:scale(1)}}
@keyframes trophyIn{0%{opacity:0;transform:scale(.2) rotate(-25deg)}65%{opacity:1;transform:scale(1.18) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes glowPulse{0%,100%{text-shadow:0 0 8px rgba(242,193,78,.25)}50%{text-shadow:0 0 28px rgba(242,193,78,.95),0 0 50px rgba(242,138,27,.5)}}
@keyframes shimmer{0%{background-position:-220% center}100%{background-position:220% center}}
@keyframes stamp{0%{opacity:0;transform:scale(1.8) rotate(-8deg)}70%{opacity:1;transform:scale(.96) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes spark{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(180deg)}}
.victory{position:relative;overflow:hidden;animation:victoryCard .75s cubic-bezier(.2,.9,.25,1.2) both}

.victory>*{position:relative;z-index:1}
.victory .stars{animation:starBurst .8s cubic-bezier(.2,1.5,.3,1) both}
.victory h2{animation:rise .7s ease .12s both}
@keyframes victoryCard{0%{opacity:0;transform:scale(.82) translateY(24px)}65%{opacity:1;transform:scale(1.035) translateY(-3px)}100%{transform:scale(1)}}
@keyframes starBurst{0%{opacity:0;transform:scale(.25) rotate(-18deg)}70%{opacity:1;transform:scale(1.18) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.victory-overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;background:rgba(24,8,32,.78);animation:vOverlay 3.8s ease forwards;will-change:opacity}
.victory-overlay:before{content:"";position:absolute;width:38vw;height:38vw;min-width:180px;min-height:180px;max-width:360px;max-height:360px;border:2px solid rgba(242,193,78,.5);border-radius:50%;animation:vRing 2.8s ease-out .05s both}
.victory-overlay:after{content:"✦   ✧   ✦   ✧   ✦";position:absolute;top:16%;left:0;right:0;text-align:center;color:#f2c14e;font-size:1.25rem;letter-spacing:.7rem;animation:vStars 3.2s ease-out .1s both}
.victory-core{text-align:center;font-weight:900;animation:vCore 3.7s ease-out forwards;position:relative;z-index:2;will-change:transform,opacity}

.victory-core .words{display:block;font-family:Marcellus,Georgia,serif;font-size:clamp(2rem,9vw,3.4rem);color:#fff8d8;letter-spacing:.05em;animation:vWords 2.2s ease-out .3s both;will-change:transform,opacity}
.victory-core .sub{display:block;margin-top:.7rem;color:#fff3d6;font-size:clamp(.95rem,4vw,1.2rem);font-weight:700;animation:vSub 1.5s ease-out .9s both;will-change:transform,opacity}
@keyframes vOverlay{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes vCore{0%{opacity:0;transform:translateY(34px) scale(.9)}18%{opacity:1;transform:translateY(0) scale(1)}72%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-18px) scale(1.02)}}
@keyframes vCup{0%{opacity:0;transform:translateY(28px) scale(.65) rotate(-6deg)}35%{opacity:1;transform:translateY(0) scale(1.05) rotate(2deg)}55%{transform:translateY(0) scale(.98) rotate(-1deg)}75%,100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
@keyframes vWords{0%{opacity:0;transform:translateY(18px) scale(.92)}35%{opacity:1;transform:translateY(0) scale(1)}75%,100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes vSub{0%{opacity:0;transform:translateY(8px)}35%,100%{opacity:1;transform:translateY(0)}}
@keyframes vRing{0%{opacity:.55;transform:scale(.7)}100%{opacity:0;transform:scale(2.6)}}
@keyframes vStars{0%{opacity:0;transform:translateY(12px) scale(.8)}25%{opacity:1;transform:translateY(0) scale(1)}75%{opacity:1;transform:translateY(-8px) scale(1)}100%{opacity:0;transform:translateY(-18px) scale(1.05)}}
@media(prefers-reduced-motion:reduce){.victory,.victory:before,.victory .stars,.victory h2,.victory-overlay,.victory-core{animation:none!important}.victory-overlay{display:none}}

<script>
// ===== BAGIAN BERSAMA: judul bab, gambar, tema, intro, router =====
const BAB=[
{t:"Pengertian Darsana",s:"Arti kata, istilah lain, Astika dan Nastika"},
{t:"Pokok Ajaran Sad Darsana",s:"Enam sistem filsafat dan penerapannya"},
{t:"Nyaya Darsana dan Catur Pramana",s:"Empat cara memperoleh pengetahuan yang benar"},
{t:"Yoga Darsana",s:"Penyatuan tubuh, pikiran, dan spiritual"},
{t:"Penerapan Sad Darsana di Masyarakat",s:"Nilai filsafat dalam kehidupan sehari-hari"},
{t:"Darsana dan Kearifan Lokal",s:"Kaitan dengan tradisi Hindu Nusantara (Bali)"}
];
const PASS=100,PK='sd_prog';

const sv=(vb,aria,b)=>`<svg viewBox="${vb}" role="img" aria-label="${aria}" xmlns="http://www.w3.org/2000/svg" font-family="Nunito,system-ui,sans-serif" text-anchor="middle">${b}</svg>`;
const G='#f2c14e',SF='#f28a1b',LT='#d9457a',CR='#fff3d6',DK='#2a1220';
const tx=(x,y,t,z,f,w)=>`<text x="${x}" y="${y}" font-size="${z}" fill="${f}"${w?` font-weight="700"`:''}>${t}</text>`;
const PIC=[
()=>sv('0 0 600 250','Bagan Darsana terbagi menjadi Astika dan Nastika',
`<rect x="205" y="12" width="190" height="48" rx="24" fill="${SF}" stroke="${G}" stroke-width="2"/>${tx(300,44,'Darsana',22,DK,1)}${tx(300,80,'drs = melihat',14,CR)}
<path d="M300 88V104M150 104H450M150 104V124M450 104V124" fill="none" stroke="${G}" stroke-width="2.5"/>
<rect x="40" y="124" width="220" height="104" rx="16" fill="rgba(242,138,27,.22)" stroke="${G}" stroke-width="2"/>${tx(150,156,'Astika',22,G,1)}${tx(150,178,'mengakui Weda',14,CR)}${tx(150,202,'6 aliran',14,CR)}${tx(150,220,'Sad Darsana',14,CR)}
<rect x="340" y="124" width="220" height="104" rx="16" fill="rgba(217,69,122,.22)" stroke="${G}" stroke-width="2"/>${tx(450,156,'Nastika',22,G,1)}${tx(450,178,'tidak mengakui Weda',14,CR)}${tx(450,202,'3 aliran',14,CR)}${tx(450,220,'Carvaka · Bauddha · Jaina',13,CR)}`),
()=>{const N=['Nyaya','Waisesika','Samkhya','Yoga','Mimamsa','Wedanta'];let l='',e='';N.forEach((n,i)=>{const a=(-90+60*i)*Math.PI/180,x=300+150*Math.cos(a),y=140+100*Math.sin(a);l+=`<line x1="300" y1="140" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${G}" stroke-width="2" opacity=".6"/>`;e+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="54" ry="28" fill="#3a0f2e" stroke="${G}" stroke-width="2"/>${tx(x.toFixed(1),(y+5).toFixed(1),n,16,G,1)}`});
return sv('0 0 600 280','Enam Darsana menuju Moksa',l+e+`<circle cx="300" cy="140" r="40" fill="${SF}" stroke="${G}" stroke-width="2"/>${tx(300,146,'Moksa',17,DK,1)}`)},
()=>{const N=[['Pratyaksa','pengamatan','langsung'],['Anumana','penarikan','kesimpulan'],['Upamana','perbandingan','pengalaman'],['Sabda','kesaksian','terpercaya']];let c='';N.forEach((n,i)=>{const x=75+i*118;c+=`<rect x="${x}" y="84" width="104" height="142" rx="8" fill="#3a0f2e" stroke="${G}" stroke-width="2"/><circle cx="${x+52}" cy="110" r="14" fill="${SF}"/>${tx(x+52,116,i+1,16,DK,1)}${tx(x+52,150,n[0],17,G,1)}${tx(x+52,176,n[1],13,CR)}${tx(x+52,194,n[2],13,CR)}`});
return sv('0 0 600 262','Empat tiang Catur Pramana menopang pengetahuan yang benar',`<polygon points="60,72 300,18 540,72" fill="rgba(242,193,78,.22)" stroke="${G}" stroke-width="2"/>${tx(300,62,'Pengetahuan yang benar',17,G,1)}<rect x="55" y="72" width="490" height="12" fill="${G}"/>${c}<rect x="55" y="226" width="490" height="12" fill="${G}"/><rect x="40" y="238" width="520" height="14" rx="3" fill="${SF}"/>`)},
()=>{const N=['Yama','Niyama','Asana','Pranayama','Pratyahara','Dharana','Dhyana','Samadhi'];let s='';N.forEach((n,i)=>{const x=36+i*66,h=48+i*22,y=250-h;s+=`<rect x="${x}" y="${y}" width="66" height="${h}" fill="rgba(242,193,78,${(.14+i*.04).toFixed(2)})" stroke="${G}" stroke-width="2"/><text x="${x+38}" y="242" font-size="15" text-anchor="start" fill="${CR}" transform="rotate(-90 ${x+38} 242)">${n}</text>`});
return sv('0 0 600 260','Delapan tangga Astangga Yoga menuju Samadhi',s+`<circle cx="120" cy="110" r="46" fill="rgba(242,193,78,.15)" stroke="${G}" stroke-width="2" stroke-dasharray="5 5"/><circle cx="120" cy="92" r="11" fill="${SF}"/><path d="M96 142Q120 96 144 142Z" fill="${LT}"/><ellipse cx="120" cy="142" rx="34" ry="8" fill="${SF}"/>${tx(120,38,'Astangga Yoga',19,G,1)}`)},
()=>{const H=(cx)=>[-1,1].map(d=>'').join('');
const P=(x,t,c1,c2,ic)=>`<rect x="${x}" y="12" width="170" height="226" rx="18" fill="rgba(242,193,78,.08)" stroke="${G}" stroke-width="2"/>${ic}${tx(x+85,176,t,18,G,1)}${tx(x+85,200,c1,14,CR)}${tx(x+85,220,c2,14,CR)}`;
const ppl=(x,y)=>`<circle cx="${x}" cy="${y}" r="12" fill="${SF}"/><path d="M${x-16} ${y+42}q16-34 32 0z" fill="${LT}"/>`;
const ic1=`<circle cx="95" cy="78" r="28" fill="none" stroke="${G}" stroke-width="5"/><line x1="115" y1="98" x2="140" y2="124" stroke="${G}" stroke-width="7" stroke-linecap="round"/><path d="M82 78l10 11 17-22" fill="none" stroke="#6fe39a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
const ic2=ppl(250,76)+ppl(300,70)+ppl(350,76)+`<path d="M262 106H338" stroke="${G}" stroke-width="3" stroke-dasharray="3 5"/>`;
const ic3=ppl(465,88)+ppl(525,88)+`<path d="M495 72C470 54 482 38 495 51C508 38 520 54 495 72Z" fill="${LT}" stroke="${G}" stroke-width="1.5"/>`;
return sv('0 0 600 250','Penerapan Sad Darsana: saring sebelum sharing, gotong royong, Tat Twam Asi',P(20,'Nyaya','Saring sebelum','sharing',ic1)+P(215,'Mimamsa','Gotong royong','menjalankan dharma',ic2)+P(410,'Wedanta','Tat Twam Asi','toleransi, welas asih',ic3))},
()=>{const nd=(x,y,a,b)=>`<ellipse cx="${x}" cy="${y}" rx="66" ry="34" fill="#3a0f2e" stroke="${G}" stroke-width="2"/>${tx(x,y-2,a,16,G,1)}${tx(x,y+17,b,14,CR)}`;

Samkhya:{i:'☯️',tok:'Rsi Kapila',f:'Purusa dan Prakerti',s:'Sistem yang menjelaskan dunia dari dua unsur: kesadaran dan materi.',k:'Purusa, Prakerti, dan tiga <i>guna</i> (Sattwa, Rajas, Tamas).',tj:'<i>Kaiwalya</i>: pembebasan dengan menyadari bahwa Purusa berbeda dari Prakerti.',r:'Realitas terdiri dari Purusa (kesadaran) dan Prakerti (materi).',
sec:[['Pengertian','Samkhya mengajarkan bahwa realitas terdiri dari dua prinsip: kesadaran (Purusa) dan alam atau materi (Prakerti).'],['Tokoh utama','Rsi Kapila; teks klasiknya <i>Samkhya Karika</i> oleh Isvarakrsna.'],['Purusa','Kesadaran murni; sebagai saksi yang tidak berubah dan tidak bertindak.'],['Prakerti','Alam atau materi asal yang terus berubah, tersusun dari tiga guna: <b>Sattwa</b> (jernih), <b>Rajas</b> (gerak, nafsu), <b>Tamas</b> (lamban, gelap). Dari Prakerti muncul pikiran, ego, indra, dan unsur-unsur alam.'],['Hubungan dan pembebasan','Penderitaan muncul ketika Purusa merasa “menyatu” dengan Prakerti. Pembebasan (<i>kaiwalya</i>) dicapai lewat pengetahuan pembeda (<i>wiweka</i>).'],['Contoh sederhana','Seperti penonton film: penonton (Purusa) menyaksikan, film (Prakerti) berubah-ubah. Sedih muncul saat penonton lupa bahwa ia hanya menonton.']]},
Yoga:{i:'🧘',tok:'Rsi Patanjali',f:'Disiplin diri dan pengendalian pikiran',s:'Jalan latihan untuk mengendalikan pikiran dan mencapai kesadaran tertinggi.',k:'Pengendalian gejolak pikiran (<i>citta wrtti nirodha</i>) dan Astangga Yoga.',tj:'Ketenangan batin dan kesadaran murni (Samadhi).',r:'Disiplin diri dan pengendalian pikiran lewat Astangga Yoga.',
sec:[['Pengertian','Kata <i>yoga</i> berkaitan dengan “menyatukan atau mengendalikan”. Yoga Sutra menyebut yoga sebagai terkendalinya gejolak pikiran.'],['Tokoh utama','Rsi Patanjali, penyusun <i>Yoga Sutra</i>.'],['Hubungan dengan Samkhya','Yoga memakai kerangka pemikiran yang dekat dengan Samkhya (Purusa dan Prakerti), tetapi menekankan <b>praktik</b> latihan, sedangkan Samkhya lebih menekankan teori.'],['Astangga Yoga (8 tahap)','STEPS'],['Contoh sehari-hari','Menarik napas dan tenang sebelum bereaksi saat marah, jujur (satya), disiplin belajar, dan fokus saat sembahyang atau mengerjakan tugas.']]},
Mimamsa:{i:'🔥',tok:'Rsi Jaimini',f:'Weda, ritual, dan kewajiban',s:'Sistem yang menekankan pelaksanaan kewajiban (Dharma) sesuai Weda.',k:'Dharma, kewajiban, dan pelaksanaan tindakan yang benar.',tj:'Hidup selaras dengan Dharma melalui tindakan yang benar.',r:'Pelaksanaan Dharma dan kewajiban menurut Weda.',
sec:[['Pengertian','Mimamsa (sering disebut Purwa Mimamsa) berarti “penyelidikan atau penafsiran”, terutama bagian Weda yang berisi perintah dan tata laksana ritual.'],['Tokoh utama','Rsi Jaimini, penyusun <i>Mimamsa Sutra</i>; tafsir terkenal oleh Sabara, dan pemikir seperti Kumarila Bhatta dan Prabhakara.'],['Pentingnya Dharma','Dharma adalah kewajiban yang benar. Manusia hidup dengan baik jika menjalankannya dengan tepat dan tulus.'],['Tindakan dan kehidupan','Hasil hidup dipengaruhi tindakan (<i>karma</i>), sehingga bertindak benar sangat penting.'],['Contoh penerapan','Siswa menjalankan kewajiban belajar, menjaga tata krama, dan bersembahyang tepat waktu dengan tertib.']]},
Wedanta:{i:'🌅',tok:'Rsi Badarayana (Wyasa)',f:'Brahman, Atman, dan Moksa',s:'Sistem yang bersumber dari Upanisad, membahas hakikat Tuhan dan jiwa.',k:'Brahman, Atman, Moksa.',tj:'Moksa: bersatunya Atman dengan Brahman, bebas dari samsara.',r:'Brahman, Atman, dan Moksa berdasarkan Upanisad.',
sec:[['Pengertian','Wedanta berarti “akhir Weda”, merujuk pada Upanisad yang merupakan bagian akhir Weda.'],['Tokoh utama','Rsi Badarayana (<i>Brahma Sutra</i>); penafsir utama: Sankara (Advaita), Ramanuja (Wisistadwaita), Madhwa (Dwaita).'],['Brahman','Realitas tertinggi, sumber segala yang ada.'],['Atman','Percikan Brahman yang ada dalam diri setiap makhluk.'],['Moksa','Pembebasan dari siklus kelahiran kembali dan penderitaan.'],['Hubungan manusia dan Brahman','Dalam Advaita Wedanta, Atman dan Brahman pada hakikatnya satu (<i>Tat Twam Asi</i>). Aliran lain melihatnya dengan hubungan yang berbeda, tetapi semuanya menekankan keterhubungan manusia dengan Tuhan.'],['Contoh sederhana','Seperti api dan percikannya: percikan berbeda bentuk, tetapi sama-sama api. Ini mengajak kita menghormati semua makhluk.']]}};
const FAK=[['Enam jalan, satu tujuan','Keenam Darsana sering dibayangkan seperti enam jalan setapak yang berbeda arah tetapi bertemu di puncak yang sama: kebenaran sejati.','🧭'],['Ragu dulu, percaya kemudian','Nyaya mengajarkan agar sebuah klaim diuji lewat pengamatan, penyimpulan, perbandingan, dan keterangan terpercaya sebelum diterima sebagai benar.','🔎'],['Memikirkan atom sejak dulu','Waisesika sudah membahas partikel terkecil penyusun benda (paramanu) jauh sebelum ilmu fisika modern lahir.','⚛️'],['Tiga sifat dalam diri','Menurut Samkhya, alam dan pikiran tersusun dari tiga guna: Sattwa (tenang dan jernih), Rajas (aktif dan gelisah), Tamas (lamban dan gelap).','🌗'],['Asana baru tahap ketiga','Dalam Astangga Yoga, sikap tubuh (asana) hanyalah tahap ketiga. Sebelumnya ada Yama dan Niyama, yaitu etika dan disiplin diri.','🧘'],['Awal dan akhir Weda','Mimamsa disebut Purwa Mimamsa karena menggarap bagian awal Weda (ritual dan kewajiban), sedangkan Wedanta menggarap bagian akhirnya (Upanisad).','📜']];
let ZS=[];try{ZS=(JSON.parse(localStorage.getItem('sd_seen'))||[]).filter(n=>ND.includes(n))}catch(e){}

const EXTRA=()=>`<div class="zsec">
<div class="zr"><div class="zeb" style="margin-top:2.2rem">Bandingkan</div><h2 style="margin-top:.2rem">Perbandingan Darsana</h2><div class="zf" id="zff">${['Semua',...ND].map((n,i)=>`<button type="button" class="${i?'':'on'}" data-f="${n}">${n}</button>`).join('')}</div>
<div class="tbl ztbl"><table><thead><tr><th>Darsana</th><th>Tokoh</th><th>Fokus</th><th>Konsep utama</th><th>Tujuan / pandangan utama</th></tr></thead><tbody id="ztb"></tbody></table></div></div>
<div class="zgrid zr" style="margin-top:1rem"><div class="zc"><h3>🤝 Persamaan</h3><p>Keenam Darsana sama-sama merupakan sistem pemikiran India yang berhubungan dengan pencarian pengetahuan dan kebenaran, meskipun pendekatannya berbeda. Semuanya juga termasuk golongan <i>Astika</i> yang menerima otoritas Weda.</p></div>
<div class="zc"><h3>🔍 Perbedaan utama</h3><p>Nyaya menekankan <b>logika</b>, Waisesika <b>kategori benda</b>, Samkhya <b>dua unsur (Purusa dan Prakerti)</b>, Yoga <b>latihan disiplin diri</b>, Mimamsa <b>kewajiban dan ritual (Dharma)</b>, dan Wedanta <b>hakikat Brahman, Atman, dan Moksa</b>.</p></div></div>
<div class="zr"><div class="zeb" style="margin-top:2.6rem">Wawasan</div><h2 style="margin-top:.2rem">Tahukah Kamu?</h2></div>
<div class="zgrid">${FAK.map(f=>`<div class="zc zfact zr"><b>${f[2]} ${f[0]}</b><p>${f[1]}</p></div>`).join('')}</div>
<div class="zr"><h2>Kesimpulan</h2><div class="note"><p style="margin:.3rem 0">Darsana merupakan bagian penting dalam pemikiran Hindu. Keenam sistemnya memiliki pendekatan yang berbeda dalam memahami pengetahuan, realitas, kehidupan, dan pembebasan. Nyaya melatih berpikir benar, Waisesika menelaah isi alam, Samkhya membedakan kesadaran dan materi, Yoga melatih diri, Mimamsa menekankan kewajiban, dan Wedanta mengarah pada kesatuan dengan Brahman. Bersama-sama, keenamnya saling melengkapi.</p></div></div>
</div>`;

function openD(n){const d=DD[n];zlast=document.activeElement;
if(!ZS.includes(n)){ZS.push(n);try{localStorage.setItem('sd_seen',JSON.stringify(ZS))}catch(e){}}
document.getElementById('zmc').innerHTML=`<div class="zeb">Darsana</div><h2>${d.i} ${n}</h2>`+d.sec.map(x=>`<h4>${x[0]}</h4>`+(x[1]==='STEPS'?'<div class="zsteps" id="zst" role="group" aria-label="Tahap Astangga Yoga">'+AS.map((a,i)=>`<button type="button" data-s="${i}">${i+1}. ${a[0]}</button>`).join('')+'</div><div class="zsd" id="zsd" aria-live="polite"></div>':`<div>${x[1]}</div>`)).join('')+`<div class="zbox"><b>Tujuan / pandangan:</b> ${d.tj}</div>`;
document.querySelectorAll('#zst button').forEach(b=>b.onclick=()=>zstep(+b.dataset.s));if(n==='Yoga')zstep(0);
zmd.classList.add('show');zmd.scrollTop=0;document.body.style.overflow='hidden';document.getElementById('zx').focus();

const t=document.getElementById('zpt');if(t){t.textContent=zpgTxt();document.getElementById('zpb').style.width=ZS.length/6*100+'%'}}
function closeZ(){if(!zmd||!zmd.classList.contains('show'))return;zmd.classList.remove('show');document.body.style.overflow='';if(zlast&&zlast.focus)try{zlast.focus({preventScroll:true})}catch(e){}}
document.getElementById('zx').onclick=closeZ;zmd.onclick=e=>{if(e.target===zmd)closeZ()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZ()});

}
